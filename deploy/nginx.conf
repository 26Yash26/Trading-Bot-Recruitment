# nginx site config for the competition VM.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/quantguild
#   sudo ln -sf /etc/nginx/sites-available/quantguild /etc/nginx/sites-enabled/quantguild
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# THE IMPORTANT PART
#
# `/var/www/html` is a git checkout of this whole private repo, hard-reset by
# GitHub Actions on every push. A default nginx root would therefore serve
# `secret/`, `server/`, `harness/` and `.git/` to anyone who guesses the path —
# private on GitHub does not mean private over HTTP.
#
# So this config never turns a request path into a file path except under an
# explicit allowlist: `/web/` and `/public/`. Everything else is either the API
# or the single-page app. There is no `try_files $uri` on the catch-all, which
# is exactly what makes traversal and dotfile probes a non-event.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with quantguildiitm.in once DNS points here

    root /var/www/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;   # bot files are capped at 512 KB by the API

    # gzip the text assets; the CSS is ~47 KB uncompressed
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "DENY"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"  always;

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The leaderboard is a server-sent event stream: no buffering, and a
        # read timeout longer than the keepalive interval or it drops every 20s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- static assets (the entire allowlist) ----------------------------
    location ^~ /web/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /public/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /favicon.ico {
        alias /var/www/html/web/favicon.svg;
        default_type image/svg+xml;
    }

    # ---- belt and braces --------------------------------------------------
    # The catch-all below can never reach these, but an accidental future
    # `try_files $uri` would, and this makes that mistake fail loudly.
    location ~ ^/(?:\.|secret|server|sandbox|harness|src|tests|docs|deploy|starter-kit|scripts)(?:/|$) {
        return 404;
    }

    # ---- single-page app --------------------------------------------------
    # Note: no $uri. Every non-API, non-asset path renders index.html, so no
    # request path is ever resolved against the filesystem.
    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}

# ---------------------------------------------------------------------------
# After certbot (`sudo certbot --nginx -d quantguildiitm.in -d www.quantguildiitm.in`)
# this block is rewritten to listen on 443. Remember to set
# QG_PUBLIC_ORIGIN=https://quantguildiitm.in in /etc/quantguild.env afterwards,
# so session cookies are issued with the Secure flag.
# ---------------------------------------------------------------------------
