# nginx site for the competition VM. Installed by deploy/setup_vm.sh to
# /etc/nginx/sites-available/quantguild, replacing the stock `default` site.
#
# The routing allowlist lives in snippets/quantguild-app.conf so the plain-HTTP
# and TLS blocks cannot drift apart — see that file for why the allowlist
# exists at all.
#
# TLS is certbot's, kept byte-for-byte compatible with what it wrote into the
# default site: same server_name, same listen directives, same cert paths and
# includes. That matters because `certbot renew` uses the nginx plugin, which
# finds the block by server_name and patches it in place. Change the shape of
# these blocks and renewal stops working three months later, quietly.

# ---------------------------------------------------------------------------
# HTTP for the domain -> redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name quantguildiitm.in www.quantguildiitm.in;

    # Leave the ACME path reachable over plain HTTP for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTP on anything else (the bare IP) — no cert exists for it, so serve
# directly rather than redirecting to a name that will not validate.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options     "nosniff"        always;
    add_header X-Frame-Options            "DENY"           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"    always;

    include /etc/nginx/snippets/quantguild-app.conf;
}

# ---------------------------------------------------------------------------
# HTTPS — the real site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server ipv6only=on;
    server_name quantguildiitm.in www.quantguildiitm.in;

    ssl_certificate     /etc/letsencrypt/live/quantguildiitm.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quantguildiitm.in/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                           # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                             # managed by Certbot

    root /var/www/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options     "nosniff"        always;
    add_header X-Frame-Options            "DENY"           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin"    always;
    # HSTS is deliberately absent until the site has run on HTTPS for a while —
    # it is hard to undo, and a bad cert day would take the whole site offline.

    include /etc/nginx/snippets/quantguild-app.conf;
}
