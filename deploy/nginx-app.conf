# The routing allowlist, included by every server block that serves the site.
# Installed to /etc/nginx/snippets/quantguild-app.conf.
#
# ---------------------------------------------------------------------------
# THE IMPORTANT PART
#
# `/var/www/html` is a git checkout of this entire private repo, hard-reset by
# GitHub Actions on every push. The stock Debian config served it with
# `try_files $uri $uri/ =404`, which handed out `.git/config`, `.git/index` and
# every source file to anyone who asked — private on GitHub does not mean
# private over HTTP.
#
# So no request path is ever turned into a file path except under the two
# prefixes below. The catch-all serves `index.html` with no `$uri` in its
# `try_files`, which is what makes traversal a non-event rather than a race
# between the URL parser and the filesystem.
# ---------------------------------------------------------------------------

# ---- API ---------------------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The leaderboard is a server-sent event stream: no buffering, and a read
    # timeout longer than the 20s keepalive or it drops on every heartbeat.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

# ---- static assets (the entire allowlist) ------------------------------
location ^~ /web/ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

location ^~ /public/ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

location = /favicon.ico {
    alias /var/www/html/web/favicon.svg;
    default_type image/svg+xml;
    access_log off;
}

# ---- belt and braces ---------------------------------------------------
# The catch-all below can never reach these, but an accidental future
# `try_files $uri` would, and this makes that mistake fail closed.
location ~ ^/(?:\.[^/]*|secret|server|sandbox|harness|src|tests|docs|deploy|scripts|starter-kit|conftest\.py|requirements\.txt|build_kit\.py|pyproject\.toml)(?:/|$) {
    return 404;
}

# ---- single-page app ---------------------------------------------------
# Note the absence of $uri: every non-API, non-asset path renders index.html,
# so a request path is never resolved against the filesystem.
location / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
