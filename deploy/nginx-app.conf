# The routing allowlist, included by every server block that serves the site.
# Installed to /etc/nginx/snippets/quantguild-app.conf.
#
# ---------------------------------------------------------------------------
# THE IMPORTANT PART
#
# `/var/www/html` is a git checkout of this entire private repo, hard-reset by
# GitHub Actions on every push. The stock Debian config served it with
# `try_files $uri $uri/ =404`, which handed out `.git/config`, `.git/index` and
# every source file to anyone who asked — private on GitHub does not mean
# private over HTTP.
#
# So no request path is ever turned into a file path except under the two
# prefixes below. The catch-all serves `index.html` with no `$uri` in its
# `try_files`, which is what makes traversal a non-event rather than a race
# between the URL parser and the filesystem.
# ---------------------------------------------------------------------------

# ---- API ---------------------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The leaderboard is a server-sent event stream: no buffering, and a read
    # timeout longer than the 20s keepalive or it drops on every heartbeat.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

# ---- static assets (the entire allowlist) ------------------------------
#
# These MUST revalidate on every request. There is no build step, so the files
# have no content hash and no version query: `/web/js/main.js` means a different
# thing before and after a deploy while keeping the same URL.
#
# With `max-age=3600` that was actively dangerous. `index.html` is `no-cache`,
# so a returning visitor revalidated the HTML and then loaded the module graph
# out of a stale cache. ES modules resolve their imports before executing
# anything, so an old `ui.js` missing an export that the new `main.js` imports
# is a LINK-TIME failure: the whole graph is discarded, not one module. The page
# renders the static footer and nothing else, with no error unless devtools is
# open, and it stays that way for up to an hour. That is exactly what a deploy
# during the orientation session would have done to everyone watching.
#
# `no-cache` does not mean "do not store" — it means "revalidate before use".
# nginx still answers with a 304 off the ETag, so the cost is one small
# conditional request per file, not a re-download.
location ^~ /web/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# The starter kit changes between releases (variations 3 and 4 land mid-event)
# under a fixed filename, so it revalidates for the same reason.
location ^~ /public/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location = /favicon.ico {
    alias /var/www/html/web/favicon.svg;
    default_type image/svg+xml;
    access_log off;
}

# ---- belt and braces ---------------------------------------------------
# The catch-all below can never reach these, but an accidental future
# `try_files $uri` would, and this makes that mistake fail closed.
#
# `late-kit` is on the list for the same reason `server` is: it holds the
# variation 3 and 4 material before those variations are released, staged
# outside `starter-kit/` precisely so it cannot be shipped by accident.
location ~ ^/(?:\.[^/]*|secret|server|sandbox|harness|src|tests|docs|deploy|scripts|starter-kit|late-kit|conftest\.py|requirements\.txt|build_kit\.py|pyproject\.toml)(?:/|$) {
    return 404;
}

# ---- single-page app ---------------------------------------------------
# Note the absence of $uri: every non-API, non-asset path renders index.html,
# so a request path is never resolved against the filesystem.
location / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
